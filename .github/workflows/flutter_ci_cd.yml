name: ByteFlow CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Test, Analyze & Build APKs/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart environment
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Make Gradle Wrapper executable
        run: chmod +x android/gradlew

      - name: Build Split-ABI Debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Build Split-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Stage and Rename Output Binaries
        run: |
          mkdir -p build-artifacts
          
          # Debug Split APKs
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk build-artifacts/ByteFlow-arm64-v8a-debug.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk build-artifacts/ByteFlow-armeabi-v7a-debug.apk
          cp build/app/outputs/flutter-apk/app-x86_64-debug.apk build-artifacts/ByteFlow-x86_64-debug.apk
          
          # Release Split APKs
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build-artifacts/ByteFlow-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build-artifacts/ByteFlow-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build-artifacts/ByteFlow-x86_64-release.apk
          
          # Release App Bundle (.aab)
          cp build/app/outputs/bundle/release/app-release.aab build-artifacts/ByteFlow-release.aab
          
          ls -lh build-artifacts/

      # ----------------------------------------------------
      # Standalone Debug APK Artifacts
      # ----------------------------------------------------
      - name: Upload arm64-v8a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteFlow-arm64-v8a-debug
          path: build-artifacts/ByteFlow-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteFlow-armeabi-v7a-debug
          path: build-artifacts/ByteFlow-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteFlow-x86_64-debug
          path: build-artifacts/ByteFlow-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ----------------------------------------------------
      # Standalone Release APK Artifacts
      # ----------------------------------------------------
      - name: Upload arm64-v8a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteFlow-arm64-v8a-release
          path: build-artifacts/ByteFlow-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteFlow-armeabi-v7a-release
          path: build-artifacts/ByteFlow-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteFlow-x86_64-release
          path: build-artifacts/ByteFlow-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------
      # Standalone Release AAB Bundle Artifact
      # ----------------------------------------------------
      - name: Upload Release App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: ByteFlow-release-bundle
          path: build-artifacts/ByteFlow-release.aab
          if-no-files-found: error
          retention-days: 30

      # ----------------------------------------------------
      # Direct Release Assets on Tag Push (One-tap install)
      # ----------------------------------------------------
      - name: Publish Direct APK Assets to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
