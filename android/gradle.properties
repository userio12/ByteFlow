android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.builtInKotlin=false
android.newDsl=false

systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en

org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configureondemand=true

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Duser.language=en -Duser.country=US